name: Backend CI

on:
  push:
    branches: [main, master]
    # paths:
    #   - 'backend/**'
    #   - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, master]
    # paths:
    #   - 'backend/**'
    #   - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Backend Test & Verification
    runs-on: ubuntu-latest

    # Service container for PostgreSQL
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: quick_wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://admin:supersecretpassword@localhost:5432/quick_wallet
      ACCESS_TOKEN: test_jwt_access_token_secret_key_ci
      REFRESH_TOKEN: test_jwt_refresh_token_secret_key_ci
      PORT: 3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Build Project
        run: npm run build

      - name: Verify Database Initialization
        run: npx tsx src/config/initDb.ts

      - name: Verify Bank Seed Script
        run: npx tsx src/config/seedBank.ts

      - name: Run Tests
        run: npm test --if-present
